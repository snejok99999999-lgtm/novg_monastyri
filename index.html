<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Монастыри Великого Новгорода</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="map" aria-label="Карта монастырей Великого Новгорода"></main>

  <aside id="sidebar" aria-live="polite">
    <div id="panel" class="panel"></div>
  </aside>

  <div id="plot-panel" class="plot-panel" hidden></div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Закрыть">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Предыдущее фото">‹</button>
    <figure class="lightbox__figure">
      <img src="" alt="Фотография объекта">
      <figcaption></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Следующее фото">›</button>
  </div>

  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="data/monasteries.js" defer></script>
  <script src="data/city-boundary.js" defer></script>
  <script src="data/pzz.js" defer></script>
  <script src="data/kadaster-plots.js" defer></script>
  <script src="data/gallery-manifest.js?v=5" defer></script>
  <script src="script.js?v=4" defer></script>
</body>
</html>
